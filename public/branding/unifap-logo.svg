<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <!-- UniFAP Institutional Symbol -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#002B49" />
    <!-- Stylized Academic Arch & Open Book / Portal -->
    <path d="M 22 58 C 22 36, 38 24, 60 24" stroke="#EAA023" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 30 62 C 30 44, 44 34, 60 34" stroke="#0080C8" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="24" r="5" fill="#EAA023" />
    <circle cx="60" cy="58" r="4" fill="#FFFFFF" />
    <!-- Dynamic Accent Dot -->
    <circle cx="24" cy="24" r="4.5" fill="#EAA023" />
  </g>
  
  <!-- Institutional Typography -->
  <text x="106" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#002B49" letter-spacing="-1">Uni<tspan fill="#EAA023">FAP</tspan></text>
  <text x="108" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#005088" letter-spacing="1.5">CENTRO UNIVERSITÁRIO</text>
  <text x="108" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#EAA023" letter-spacing="3">SORTEIOS</text>
</svg>
