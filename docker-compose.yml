services:
  postgres:
    image: postgres:16-alpine
    container_name: unifap_sorteios_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: unifap_sorteios
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unifap_sorteios"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifap_sorteios_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword2026@postgres:5432/unifap_sorteios?schema=public
      - AUTH_SECRET=unifap-sorteios-super-secret-key-change-in-production-2026
      - NEXTAUTH_SECRET=unifap-sorteios-super-secret-key-change-in-production-2026
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=./public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
